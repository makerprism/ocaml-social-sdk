name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt update && sudo apt-get install -y libev-dev libgmp-dev libssl-dev pkg-config

      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: ${{ runner.os }}-dune-${{ hashFiles('dune-project') }}
          restore-keys: |
            ${{ runner.os }}-dune-

      - name: Setup Dune
        uses: ocaml-dune/setup-dune@v1
        with:
          version: latest

      - name: Lock dependencies
        run: dune pkg lock

      - name: Build project
        run: dune build

      - name: Run tests
        run: dune runtest

      - name: Verify package metadata
        run: dune build @pkg-install
