name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and test
    runs-on: ubicloud-standard-2

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: sudo apt update && sudo apt-get install -y libev-dev libgmp-dev libssl-dev pkg-config

      - name: Cache dune
        uses: actions/cache@v4
        with:
          path: ~/.cache/dune
          key: ${{ runner.os }}-dune-${{ hashFiles('dune-project') }}
          restore-keys: |
            ${{ runner.os }}-dune-

      - name: Setup Dune
        uses: ocaml-dune/setup-dune@v1
        with:
          # Pinned, not "latest". The installer only serves versions that have
          # a binary release in ocaml-dune/dune-bin, and 3.21.0 is the newest
          # of those, so "latest" was never actually floating. Pinning makes
          # that explicit and keeps the run reproducible.
          #
          # 3.21.0 cannot read ocaml-compiler.5.5.0's opam file ("Variable
          # \"build-id\" is not supported"), which is why every run since
          # 2026-05-12 died in "Lock dependencies" and never reached build or
          # test. dune-workspace keeps the resolver off 5.5.0; see the comment
          # there.
          version: 3.21.0

      - name: Lock dependencies
        run: dune pkg lock

      - name: Build project
        run: dune build

      - name: Run tests
        run: dune runtest

      - name: Verify package metadata
        run: dune build @pkg-install
